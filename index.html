.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{background:var(--blue);color:#fff;padding:12px 0 10px;position:sticky;top:0;z-index:20}

.bar{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#8fd6a8;width:0;transition:width .3s}
.picker{margin:12px 0 2px}
.picker select{width:100%;padding:13px 12px;font-size:16px;font-family:inherit;

nav{display:flex;gap:5px;margin:10px 0 4px}

section{display:none;padding-top:8px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;position:relative}
.card h3{margin:0 0 7px;font-size:15px;color:var(--blue);padding-right:40px}
.sayb{position:absolute;top:11px;right:11px;border:1px solid var(--line);background:#fff;

.cn{color:var(--cn)}

.next.on{display:block}

g:`<div class="card"><h3>이 주차에서 할 것</h3>
어휘와 표현 — 감사와 관련된 어휘<br>
문법 — <b>-(으)ㄴ/는 덕분에</b>, <b>-(으)ㄹ 뻔하다</b><br>
목표 — 감사의 인사를 <b>정중하게</b> 표현할 수 있다.</div>

<div class="card"><h3>① -(으)ㄴ/는 덕분에 — 多亏了…</h3>
앞의 원인·이유로 뒤에 <b>긍정적인 결과</b>가 나타날 때.
<table><tr><th>품사</th><th>형태</th><th>예</th></tr>
<tr><td>동사 (모두)</td><td>-는 덕분에</td><td>먹는·읽는·듣는·가는·주는·마시는·<b>노는</b></td></tr>
<tr><td>형용사 받침O</td><td>-은 덕분에</td><td>좋은·많은·높은·<b>가벼운</b></td></tr>
<tr><td>형용사 받침X·ㄹ</td><td>-ㄴ 덕분에</td><td>기쁜·다른·바쁜·<b>먼</b></td></tr></table>
· 선생님께서 <b>도와주신 덕분에</b> 좋은 결과를 얻을 수 있었습니다.<br>
· 열심히 <b>준비한 덕분에</b> 합격할 수 있었어요.
<div class="hint">명사는 바로 — <b>선생님 덕분에</b>, 친구 덕분에.<br>
<b>부정적인</b> 결과는 「-(으)ㄴ/는 <b>탓에</b>」 — 늦잠을 잔 <b>탓에</b> 지각을 했다. 이건 다 네 <b>탓</b>이야!
<span class="cn">덕분에=好结果，탓에=坏结果。这个对比最常考。</span></div></div>

<div class="card"><h3>② -(으)ㄹ 뻔하다 — 差点就…</h3>
실제로 일어나지는 않았지만 <b>그럴 가능성이 매우 높았음</b>.
<table><tr><th>조건</th><th>예</th></tr>
<tr><td>받침 O → -을 뻔하다</td><td>먹을·늦을·죽을·<b>들을</b>(듣다)</td></tr>
<tr><td>받침 X·ㄹ → -ㄹ 뻔하다</td><td>다칠·놓칠·실수할·넘어질·<b>팔</b>(팔다)</td></tr></table>
· 늦잠을 자서 학교에 <b>늦을 뻔했어요</b>. · 지하철에서 가방을 놓고 <b>내릴 뻔했어요</b>.
<div class="hint"><b>하마터면</b>과 함께 쓰면 뜻이 강해집니다 — 하마터면 교통사고가 날 뻔했어요.</div></div>

<div class="card"><h3>오늘의 대화 — TOPIK 5급 합격</h3>
<div class="dlg"><b>이서준</b> 엘레나 씨, 이번 토픽 시험에서 드디어 5급을 받았다면서요? 축하해요.<br>
<b>엘레나</b> 고마워요. 선생님과 함께 공부한 <b>덕분에</b> 좋은 결과가 나온 것 같아요.<br>
<b>이서준</b> 이번에 시험 준비하면서 힘든 점은 없었어요?<br>
<b>엘레나</b> 사실 마지막 주에 감기에 심하게 걸려서 공부를 많이 못 했어요.<br>
<b>엘레나</b> 열이 심하게 나서 시험장에도 못 <b>갈 뻔했거든요</b>.<br>
<b>이서준</b> 그래도 좋은 결과를 받아서 다행이에요.<br>
<b>엘레나</b> 선생님께서 쓰기 숙제를 <b>세심하게</b> 봐주신 <b>덕분</b>이지요. <b>진심으로</b> 감사하게 생각하고 있어요.</div></div>

<div class="card"><h3>발음 — 모음조화</h3>
비슷한 모음끼리 어울려 쓰는 것을 <b>모음조화</b>라고 합니다.
<table><tr><th>어간에 ㅗ·ㅏ 있음 → ㅏ</th><th>어간에 ㅗ·ㅏ 없음 → ㅓ</th></tr>
<tr><td>가+아=가 · 보+아=봐 · 막+아=막아<br>좁+아=좁아 · 잡+았다=잡았다 · 놀+았다=놀았다</td>
<td>서+어=서 · 주+어=줘 · 먹+어=먹어<br>마시+어=마셔 · 춥+어=추워 · 입+어=입어</td></tr></table>
<div class="hint">어간 끝 모음이 <b>ㅡ</b>면, 그 <b>앞</b> 모음을 봅니다 — 아프+아=<b>아파</b>, 고프+아=<b>고파</b> / 크+어=<b>커</b>, 예쁘+어=<b>예뻐</b>.</div></div>`,

<div class="card"><h3>듣기 — 대화 여섯 개</h3>
<div class="dlg"><b>① 91회 1번</b> 여: 손님, 마음에 드는 넥타이 있으세요? / 남: 제일 오른쪽에 있는 줄무늬 넥타이가 괜찮아 보이네요. / 여: 그럼 이걸로 꺼내서 보여 드릴까요?<br><br>
<b>② 91회 2번</b> 남: 음, 이 사과 정말 달고 맛있네요. / 여: 그러네요. 하나 더 깎을까요? / 남: 네, 좋아요. 수미 씨는 먹고 있어요. 제가 할게요.<br><br>
<b>③ 83회 1번</b> 여: 지금 전시장에 들어갈 수 있어요? / 남: 잠시만 기다려 주세요. 곧 입장 시작합니다. / 여: 네. 알겠습니다.<br><br>
<b>④ 83회 2번</b> 남: 아, 무거워. 이 화분은 어디에 놓을까? / 여: 여기 창문 앞은 어때? / 남: 그래. 거기가 좋겠다.</div>
<div class="hint"><b>마지막 말이 답을 정합니다.</b> 「꺼내서 보여 드릴까요」 → 아직 꺼내지 않은 장면,

<div class="card"><h3>듣기 — 그래프 문제 둘</h3>

<div class="card"><h3>듣기 ① 창업 지원 사업 (64회 31–32번)</h3>
<div class="dlg"><b>여</b> 재학생을 대상으로 한 창업 지원 사업은 <b>사전 교육을 강화</b>하는 방향으로 가야 한다고 생각합니다.<br>

<div class="hint">남자는 여자 의견을 <b>정면으로 반대</b>합니다 → 태도는 <b>‘상대방 의견에 반대하고 있다’</b>.

g:`<div class="card"><h3>이 주차에서 할 것</h3>
① 통역과 번역의 개념 ② 통번역과 <b>등가</b> ③ 문장의 <b>명사화</b></div>

<div class="card"><h3>① 사전적 의미</h3>
<table><tr><th></th><th>사전 뜻</th></tr>
<tr><td><b>통역</b></td><td>말이 통하지 아니하는 사람 사이에서 <b>뜻이 통하도록 말을 옮겨 줌</b></td></tr>
<tr><td><b>번역</b></td><td>말이나 글을 <b>다른 언어의 말이나 글로 바꾸어 옮김</b></td></tr></table>
영어사전 — The process of changing something that is written or spoken into another language<br>
중국어사전 — 한 언어의 의미를 다른 언어로 표현함</div>

<div class="card"><h3>② 넓은 뜻과 좁은 뜻</h3>
<table><tr><th>구분</th><th>대상</th><th>의미</th></tr>
<tr><td>번역(넓은 뜻)</td><td>말이나 글</td><td>말이나 글을 다른 언어로 옮기는 것</td></tr>
<tr><td>번역(좁은 뜻)</td><td>글(문어)</td><td>문어를 다른 언어의 문어로 옮기는 것</td></tr>
<tr><td>통역</td><td>말(구어)</td><td>구어를 다른 언어의 구어로 옮기는 것</td></tr></table>
<div class="hint">넓은 의미의 번역(Translation)에는 <b>문어→문어 · 구어→구어 · 문어→구어 · 구어→문어</b>가 다 들어갑니다.<br>
프란츠 푀히하커 — “<b>통역은 번역의 한 종류이고, 특별한 방식이다.</b>”</div></div>

<div class="card"><h3>③ 말과 글의 차이</h3>
<table><tr><th>말(구어)</th><th>글(문어)</th></tr>
<tr><td>말하는 사람과 듣는 사람이 <b>같은 공간</b></td><td>쓰는 사람과 읽는 사람이 <b>다른 공간</b></td></tr>
<tr><td>순간적이라 한번 말하면 <b>사라진다</b></td><td><b>반복해서</b> 읽을 수 있다</td></tr>
<tr><td>몸짓·표정·억양으로 의미를 이해</td><td>비언어적 표현을 쓰기 어렵다</td></tr>
<tr><td>문장이 <b>짧고 단순</b>할 수 있다</td><td>문장이 <b>길고 복잡</b>할 수 있다</td></tr>
<tr><td>정확하지 않고 완전하지 않을 수 있다</td><td><b>정확하고 완전</b>하다</td></tr>
<tr><td>듣는 사람의 반응이 <b>바로</b> 나타난다</td><td>읽는 사람의 반응을 알 수 없다</td></tr></table></div>

<div class="card"><h3>④ 통역의 특징 — 일회성·즉시성</h3>
<b>일회성</b> 한 번 듣고 통역한다. 한번 통역한 후 다시 되돌릴 수 없다.<br>
<b>즉시성</b> 들으면서 바로, 또는 듣고 난 후 바로 통역한다.<br>
반면 번역은 <b>번역한 글을 다시 읽고 고칠 수 있다</b>.</div>

<div class="card"><h3>⑤ 등가(Equivalence)</h3>
원문과 번역문이 <b>최대한 비슷해야 한다</b>. 원문의 <b>의미·형식·언어적 특징·문화적 특징·작가의 의도</b>를
동일하게 번역할 때 ‘등가를 이룬다’고 말한다. <b>발음 [등까]</b><br>
라티셰프 — “통번역은 두 개의 언어로 하는 소통을 하나의 언어 소통과 최대한 비슷하게 중개하는 활동이다.”
<div class="hint">나이다(Eugene A. Nida)의 두 가지<br>
<b>형식적 등가</b> — 원문의 <b>형식과 내용</b>을 최대한 동일하게 번역<br>
<b>역동적 등가</b> — 원문 독자의 <b>반응</b>과 번역문 독자의 반응이 최대한 동일하게</div></div>

<div class="card"><h3>⑥ 문장의 명사화 — 네 가지 방법</h3>
명사가 아닌 것을 명사로 만든다. 예) 밥을 먹다 → <b>밥을 먹음 / 밥 먹기 / 식사</b>
<table><tr><th>방법</th><th>예</th></tr>
<tr><td>① 마지막 동사·형용사에 <b>-음/-ㅁ, -기</b>를 붙인다</td><td>있어야 한다 → <b>함</b> / 있어도 된다 → <b>됨</b></td></tr>
<tr><td>② 동사·형용사를 <b>한자 명사</b>로 바꾼다 (조사 변경·생략 가능)</td><td>같은 공간에 있어야 한다 → <b>동일 공간에 위치</b></td></tr>
<tr><td>③ 단어들을 한자 명사로 바꾸고 <b>순서를 바꾸거나 생략</b></td><td>통역을 할 때는 → <b>통역 시</b> / 듣는 사람들과 → <b>청중과</b></td></tr>
<tr><td>④ 문장을 <b>하나로 합친다</b></td><td>통역 시 청중과 통역사는 동일 공간에 위치하나 번역 시 독자와 번역가는 공간 분리 가능</td></tr></table>
<div class="hint">공고문·보고서처럼 <b>공식적인 문서</b>는 문장 끝이 명사로 끝납니다 — 「선발 인원: 4명」「조정될 수 있음」.</div></div>`,

/* ══ 읽어주기 ══ */
let AU=null;
function stopAudio(){ if(AU){AU.pause();AU=null} try{speechSynthesis.cancel()}catch(e){} }
function say(t,id){
  stopAudio();
  if(id){                       // 미리 만들어 둔 원어민 음성
    const a=new Audio("au/"+id+".mp3?v=2");
    AU=a;
    a.play().then(()=>{}).catch(()=>{ AU=null; sayTTS(t); });
    a.onerror=()=>{ AU=null; sayTTS(t); };
    return;
  }
  sayTTS(t);
}
function sayTTS(t){
  try{
    if(!window.speechSynthesis)return;
    const u=new SpeechSynthesisUtterance(String(t).replace(/\s+/g," ").trim());
    u.lang="ko-KR"; u.rate=0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 모든 설명 상자에 읽어주기 버튼을 자동으로 붙인다 */
function addSay(root,pfx){
  root.querySelectorAll(".card").forEach((c,i)=>{
    if(c.querySelector(":scope > .sayb"))return;
    const b=document.createElement("button");
    b.className="sayb"; b.textContent="🔊"; b.title="읽어주기";
    const id = pfx ? pfx+"_"+String(i+1).padStart(2,"0") : null;
    b.onclick=e=>{e.stopPropagation();say(c.innerText,id)};
    c.appendChild(b);
  });
}

  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.t).classList.add("on");
  if(b.dataset.t==="w")drawWrong();
  if(b.dataset.t==="p")drawPage();
});

/* ══ 듣기 ══ */
function drawL(){
  const box=document.getElementById("lBox"), a=C[cur].au;
  if(!a){box.innerHTML='<div class="soon"><b>이 과목은 원어민 음성이 없습니다</b>단어 탭의 🔊 버튼으로 들을 수 있습니다.</div>';return}
  let h='<div class="card"><h3>어휘 전체 듣기 — 원어민 <span style="font-weight:400;color:var(--sub);font-size:13px">'+
        (a.vocLen||"")+'</span></h3>'+
        '<audio controls preload="metadata" style="width:100%" src="'+a.voc+'"></audio>'+
        '<div class="hint">이 주차 어휘를 이어서 읽어줍니다. 단어 탭을 넘기면서 같이 들으세요.</div></div>';
  h+='<div class="card"><h3>대화 '+a.dia.length+'개</h3>'+
     '<button id="playAll" style="width:100%;padding:14px;margin-bottom:10px;border:0;border-radius:11px;'+
     'background:var(--blue2);color:#fff;font-size:16px;font-weight:700;cursor:pointer">▶ '+a.dia.length+'개 이어서 듣기</button>'+
     '<div id="allNow" style="text-align:center;color:var(--sub);font-size:13px;margin-bottom:6px"></div>';
  a.dia.forEach((s,i)=>{
    const src=Array.isArray(s)?s[0]:s, len=Array.isArray(s)?s[1]:"";
    h+='<div style="margin:9px 0"><b>대화 '+(i+1)+'</b> <span style="color:var(--sub);font-size:13px">'+len+'</span>'+
       '<audio class="dia" controls preload="metadata" style="width:100%;margin-top:4px" src="'+src+'"></audio></div>'});
  h+='<div class="hint"><b>대화는 3~9초짜리 짧은 문장입니다.</b> 위의 <b>이어서 듣기</b>로 죽 듣는 게 편합니다.<br>'+
     '먼저 <b>보지 말고 듣고</b>, 무슨 상황인지 생각한 뒤 정리 탭을 펴세요.</div></div>';
  box.innerHTML=h; addSay(box);
  const list=[...box.querySelectorAll("audio.dia")], now=document.getElementById("allNow");
  let idx=-1,on=false;
  function stopAll(){list.forEach(x=>{x.pause();x.currentTime=0})}
  function step(){
    idx++;
    if(idx>=list.length){on=false;idx=-1;now.textContent="";
      document.getElementById("playAll").textContent="▶ "+list.length+"개 이어서 듣기";return}
    now.textContent="대화 "+(idx+1)+" / "+list.length+" 재생 중";
    const el=list[idx]; el.onended=()=>{if(on)step()};
    el.play().catch(()=>{on=false;now.textContent="재생이 막혔습니다. 화면을 한 번 누른 뒤 다시 시도하세요."});
  }
  document.getElementById("playAll").onclick=e=>{
    if(on){on=false;stopAll();now.textContent="";e.target.textContent="▶ "+list.length+"개 이어서 듣기";return}
    stopAll();on=true;idx=-1;e.target.textContent="■ 멈추기";step();
  };
}

/* ══ 단어 ══ */
let vi=0,vBack=false,vList=[];
function drawV(){
  const box=document.getElementById("vBox");
  if(!vList.length){box.innerHTML='<div class="soon"><b>준비 중</b></div>';return}
  const p=vList[vi];
  box.innerHTML='<div class="flip" id="fc"><div>'+
    '<div class="'+(vBack?"zh":"ko")+'">'+(vBack?p[1]:p[0])+'</div>'+
    '<div class="tap">눌러서 뒤집기 点击翻面</div></div></div>'+
    '<button class="wide" id="vSay">🔊 이 단어 읽어주기</button>'+
    '<div class="rowbtn"><button id="vP">← 이전</button><button id="vS">섞기</button><button id="vN">다음 →</button></div>'+
    '<div class="count">'+(vi+1)+' / '+vList.length+'</div>';
  document.getElementById("vSay").onclick=e=>{e.stopPropagation();say(p[0]+". "+p[1],cur+"_v"+String(p[2]).padStart(2,"0"))};
  document.getElementById("fc").onclick=()=>{vBack=!vBack;drawV()};
  document.getElementById("vN").onclick=()=>{vi=(vi+1)%vList.length;vBack=false;drawV()};
  document.getElementById("vP").onclick=()=>{vi=(vi-1+vList.length)%vList.length;vBack=false;drawV()};
  document.getElementById("vS").onclick=()=>{
    for(let i=vList.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vList[i],vList[j]]=[vList[j],vList[i]]}
    vi=0;vBack=false;drawV()};
}

/* ══ 문제 ══ */
function QS(){return C[cur].q||[]}
function foot(){
  document.getElementById("fOk").textContent=S.ok;
  document.getElementById("fNo").textContent=S.no;
  document.getElementById("fLeft").textContent=Math.max(0,QS().length-S.i);
  document.getElementById("pbar").style.width=(QS().length?S.i/QS().length*100:0)+"%";
}
function drawQ(){
  const box=document.getElementById("qBox"),Q=QS();
  if(!Q.length){box.innerHTML='<div class="soon"><b>준비 중</b></div>';foot();return}
  if(S.i>=Q.length){
    const r=Math.round(S.ok/(S.ok+S.no||1)*100);
    box.innerHTML='<div class="done"><div class="big">'+r+'점</div><p>'+Q.length+'문제 중 '+S.ok+'개 정답.</p>'+
      (S.wrong.length?'<p>틀린 '+S.wrong.length+'문제는 <b>오답</b> 탭에서 다시 보세요.</p>':'<p>전부 맞혔습니다.</p>')+'</div>';
    foot();return}
  const n=S.i,it=Q[n];
  let h='<div class="q"><div class="qn">'+(n+1)+' / '+Q.length+'</div>'+
        '<div class="qt">'+it.q+' <button id="qSay" style="border:1px solid var(--line);background:#fff;'+
        'border-radius:8px;padding:3px 9px;font-size:14px;cursor:pointer;vertical-align:middle">🔊</button></div>';
  if(it.s) h+='<div class="qs">'+it.s+'</div>';
  if(it.img){ h+='<div class="imgwrap">';
    it.img.forEach((src,k)=>h+='<button class="optimg" data-k="'+k+'"><div class="n">'+
        it.o[k]+'</div><img src="'+src+'" alt="보기 '+(k+1)+'" loading="lazy"></button>');
    h+='</div>'; }
  else it.o.forEach((t,k)=>h+='<button class="opt" data-k="'+k+'">'+t+'</button>');
  h+='<div class="fb" id="fb"></div><button class="next" id="nx">다음 문제 →</button></div>';
  box.innerHTML=h;
  document.getElementById("qSay").onclick=()=>say(((it.q||'')+' '+(it.s||'')).replace(/<[^>]*>/g,' '));
  let done=false;
  const sel2 = it.img ? ".optimg" : ".opt";
  box.querySelectorAll(sel2).forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const k=+b.dataset.k,fb=document.getElementById("fb");
    box.querySelectorAll(sel2)[it.a].classList.add("ok");
    if(k===it.a){S.ok++;fb.className="fb s";fb.innerHTML="정답입니다. "+it.e}
    else{b.classList.add("no");S.no++;if(!S.wrong.includes(n))S.wrong.push(n);
      fb.className="fb f";fb.innerHTML="아쉽습니다. "+it.e}
    document.getElementById("nx").classList.add("on");save();foot()});
  box.querySelector("#nx").onclick=()=>{S.i++;save();drawQ()};
  foot();
}
function drawWrong(){
  const box=document.getElementById("wBox"),Q=QS();
  if(!S.wrong.length){box.innerHTML='<div class="soon"><b>아직 틀린 문제가 없습니다.</b></div>';return}
  let h="";S.wrong.forEach(n=>{const it=Q[n];
    h+='<div class="q"><div class="qn">'+(n+1)+'번</div><div class="qt">'+it.q+'</div>'+
       (it.s?'<div class="qs">'+it.s+'</div>':'')+
       (it.img?'<img src="'+it.img[it.a]+'" style="width:100%;border-radius:8px;margin:6px 0">':'')+
       '<div class="fb s" style="display:block">정답 — <b>'+it.o[it.a]+'</b><br>'+it.e+'</div></div>'});
  box.innerHTML=h;
}

function drawPage(){
  const box=document.getElementById("pBox"), s=SL[cur]||[];
  if(!s.length){box.innerHTML='<div class="soon"><b>교안 이미지가 없습니다.</b></div>';return}
  let h='<div class="card"><h3>학교 교안 원본 '+s.length+'장</h3>'+
        '수업에서 쓰는 교안을 그대로 옮긴 것입니다. 위의 <b>정리</b> 탭은 이 교안을 풀어 쓴 것이고, '+
        '여기서는 <b>원본 그대로</b> 볼 수 있습니다. 눌러서 크게 보세요.</div>';
  s.forEach((f,i)=>h+='<div class="slide"><a href="img/'+f+'" target="_blank" rel="noopener">'+
     '<img src="img/'+f+'" alt="교안 '+(i+1)+'" loading="lazy"></a>'+
     '<div class="cap">'+(i+1)+' / '+s.length+'</div></div>');
  box.innerHTML=h; addSay(box);
}

/* ══ 그리기 ══ */
function render(){
  const c=C[cur];
  document.getElementById("hTitle").textContent=c.name;
  document.getElementById("hSub").textContent=c.week+" · "+c.sub;
  vList=(c.voc||[]).map((x,i)=>[x[0],x[1],i+1]);vi=0;vBack=false;
  const g=document.getElementById("gBox");
  g.innerHTML=c.g||'<div class="soon"><b>준비 중</b></div>';
  addSay(g, cur+"_g");
  stopAudio();
  drawV();drawL();drawQ();drawWrong();
  document.getElementById("pBox").innerHTML="";
}
document.getElementById("reset").onclick=()=>{
  if(confirm(C[cur].name+" 기록을 지우고 다시 풀까요?")){
    S={i:0,ok:0,no:0,wrong:[]};save();drawQ();
    document.querySelector('nav button[data-t="q"]').click()}
};
load();render();
</script>
</body>
</html>
