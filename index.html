<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026-2학기 1주차 학습앱</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b1b1f;--sub:#6b7280;--blue:#1a3a6b;--blue2:#3a6fb5;
--cn:#a23b2d;--ok:#0a7d4b;--no:#c0322a;--line:#dbe2ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,"Malgun Gothic","맑은 고딕","Microsoft YaHei",sans-serif;
font-size:16px;line-height:1.6;padding-bottom:86px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{background:var(--blue);color:#fff;padding:12px 0 10px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:16px;font-weight:700}
header .s{font-size:12px;opacity:.85;margin-top:1px}
.bar{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#8fd6a8;width:0;transition:width .3s}
.picker{margin:12px 0 2px}
.picker.two{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.loading{text-align:center;padding:40px 16px;color:var(--sub);font-size:15px}
.picker select{width:100%;padding:13px 12px;font-size:16px;font-family:inherit;
border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
nav{display:flex;gap:5px;margin:10px 0 4px}
nav button{flex:1;padding:10px 2px;border:1px solid var(--line);background:var(--card);
border-radius:10px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
nav button.on{background:var(--blue2);border-color:var(--blue2);color:#fff}
section{display:none;padding-top:8px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:10px 0;position:relative}
.card h3{margin:0 0 7px;font-size:15px;color:var(--blue);padding-right:40px}
.sayb{position:absolute;top:11px;right:11px;border:1px solid var(--line);background:#fff;
border-radius:9px;padding:4px 9px;font-size:15px;cursor:pointer;line-height:1}
.cn{color:var(--cn)}
.hint{background:#fff8e1;border-left:4px solid #e0a800;padding:10px 12px;border-radius:0 8px 8px 0;margin:9px 0;font-size:14px}
.dlg{background:#f2f6fb;border-left:4px solid var(--blue2);padding:10px 12px;border-radius:0 8px 8px 0;margin:9px 0;font-size:14.5px;line-height:1.75}
.dlg b{color:var(--blue)}
table{width:100%;border-collapse:collapse;margin:6px 0}
th,td{border:.6px solid var(--line);padding:4px 7px;font-size:13.5px;text-align:left;vertical-align:top}
th{background:#eef2f7;font-weight:600}
.flip{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:150px;
display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;margin:12px 0;cursor:pointer;user-select:none}
.flip .ko{font-size:26px;font-weight:700}
.flip .zh{font-size:23px;font-weight:700;color:var(--cn)}
.flip .tap{font-size:12px;color:var(--sub);margin-top:10px}
.rowbtn{display:flex;gap:8px}
.rowbtn button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;cursor:pointer}
.wide{width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--line);background:#fff;
border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.count{text-align:center;color:var(--sub);font-size:13px;margin-top:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0}
.qn{font-size:12px;color:var(--sub);margin-bottom:5px}
.qt{font-size:16.5px;font-weight:600;margin-bottom:12px;line-height:1.55}
.qs{background:#f2f6fb;border-radius:8px;padding:9px 11px;margin:-4px 0 12px;font-size:14.5px;font-weight:400;line-height:1.7}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:7px 0;border:1.5px solid var(--line);
background:#fff;border-radius:10px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:#e9f7ef;color:var(--ok);font-weight:700}
.opt.no{border-color:var(--no);background:#fdeceb;color:var(--no);font-weight:700}
.fb{margin-top:10px;padding:11px 12px;border-radius:9px;font-size:14px;display:none}
.fb.s{display:block;background:#e9f7ef;border-left:4px solid var(--ok)}
.fb.f{display:block;background:#fdeceb;border-left:4px solid var(--no)}
.imgwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.optimg{display:block;width:100%;padding:6px;margin:0;border:1.5px solid var(--line);
background:#fff;border-radius:10px;cursor:pointer;font-family:inherit;text-align:center}
.optimg img{width:100%;border-radius:6px;display:block}
.optimg .n{font-size:15px;font-weight:700;color:var(--sub);margin-bottom:5px}
.optimg.ok{border-color:var(--ok);background:#e9f7ef}.optimg.ok .n{color:var(--ok)}
.optimg.no{border-color:var(--no);background:#fdeceb}.optimg.no .n{color:var(--no)}
.slide{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;margin:9px 0}
.slide img{width:100%;border-radius:6px;display:block}
.slide .cap{font-size:12px;color:var(--sub);padding:5px 3px 1px}
.next{width:100%;padding:15px;margin-top:12px;border:0;border-radius:11px;background:var(--blue2);
color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:none}
.next.on{display:block}
.done{text-align:center;padding:24px 16px}
.done .big{font-size:36px;font-weight:800;color:var(--blue)}
.done p{color:var(--sub);font-size:14px}
.soon{text-align:center;padding:30px 18px;color:var(--sub)}
.soon b{color:var(--ink);display:block;font-size:17px;margin-bottom:6px}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
footer .wrap{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
footer b{color:var(--ink)}
footer button{margin-left:auto;padding:8px 13px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;cursor:pointer}
</style>
<script src="data/slides.js"></script>
</head>
<body>

<header><div class="wrap">
  <h1 id="hTitle">2026-2학기 · 1주차</h1>
  <div class="s" id="hSub">과목을 고르세요</div>
  <div class="bar"><i id="pbar"></i></div>
</div></header>

<div class="wrap">
  <div class="picker two">
    <select id="wsel"></select>
    <select id="sel"></select>
  </div>
  <nav>
    <button class="on" data-t="v">단어</button>
    <button data-t="l">듣기</button>
    <button data-t="g">정리</button>
    <button data-t="q">문제</button>
    <button data-t="w">오답</button>
    <button data-t="p">교안</button>
  </nav>
  <section id="v" class="on"><div id="vBox"></div></section>
  <section id="l"><div id="lBox"></div></section>
  <section id="g"><div id="gBox"></div></section>
  <section id="q"><div id="qBox"></div></section>
  <section id="w"><div id="wBox"></div></section>
  <section id="p"><div id="pBox"></div></section>
</div>

<footer><div class="wrap">
  맞음 <b id="fOk">0</b> · 틀림 <b id="fNo">0</b> · 남음 <b id="fLeft">0</b>
  <button id="reset">이 과목 처음부터</button>
</div></footer>

<script>
let C = {};


/* ══ 상태 ══ */
const WEEKS=[1,2];                       // 지금 만들어 둔 주차
let wk = +(localStorage.getItem("cufs_wk")||1);
if(!WEEKS.includes(wk)) wk = 1;
let KEYS=[];
let cur=localStorage.getItem("cufs_cur")||"k2";
function K(){return "cufs_w"+wk+"_"+cur}
let S;
function load(){S=JSON.parse(localStorage.getItem(K())||'{"i":0,"ok":0,"no":0,"wrong":[]}')}
function save(){try{localStorage.setItem(K(),JSON.stringify(S));localStorage.setItem("cufs_cur",cur);localStorage.setItem("cufs_wk",wk)}catch(e){}}

/* ══ 읽어주기 ══ */
let AU=null;
function stopAudio(){ if(AU){AU.pause();AU=null} try{speechSynthesis.cancel()}catch(e){} }
function say(t,id){
  stopAudio();
  if(id){                       // 미리 만들어 둔 원어민 음성
    const a=new Audio("au/w"+wk+"/"+id+".mp3?v=2");
    AU=a;
    a.play().then(()=>{}).catch(()=>{ AU=null; sayTTS(t); });
    a.onerror=()=>{ AU=null; sayTTS(t); };
    return;
  }
  sayTTS(t);
}
function sayTTS(t){
  try{
    if(!window.speechSynthesis)return;
    const u=new SpeechSynthesisUtterance(String(t).replace(/\s+/g," ").trim());
    u.lang="ko-KR"; u.rate=0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 모든 설명 상자에 읽어주기 버튼을 자동으로 붙인다 */
function addSay(root,pfx){
  root.querySelectorAll(".card").forEach((c,i)=>{
    if(c.querySelector(":scope > .sayb"))return;
    const b=document.createElement("button");
    b.className="sayb"; b.textContent="🔊"; b.title="읽어주기";
    const id = pfx ? pfx+"_"+String(i+1).padStart(2,"0") : null;
    b.onclick=e=>{e.stopPropagation();say(c.innerText,id)};
    c.appendChild(b);
  });
}

/* ══ 과목 선택 ══ */
const sel=document.getElementById("sel"), wsel=document.getElementById("wsel");
WEEKS.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n+"주차";wsel.appendChild(o)});
wsel.value=wk;
function fillSubjects(){
  sel.innerHTML="";
  KEYS.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=C[k].name;sel.appendChild(o)});
  if(!C[cur]) cur=KEYS[0];
  sel.value=cur;
}
sel.onchange=()=>{cur=sel.value;load();render()};
wsel.onchange=()=>{ wk=+wsel.value; localStorage.setItem("cufs_wk",wk); openWeek(wk); };

/* ══ 주차 내려받기 — 고른 주차만 가져온다 ══ */
function loadWeek(n){
  return new Promise((ok,no)=>{
    if(window.WEEK && window.WEEK[n]) return ok();
    const s=document.createElement("script");
    s.src="data/w"+n+".js";
    s.onload=()=>ok(); s.onerror=()=>no(new Error("w"+n));
    document.head.appendChild(s);
  });
}
function openWeek(n){
  document.getElementById("gBox").innerHTML='<div class="loading">'+n+'주차를 가져오는 중…</div>';
  loadWeek(n).then(()=>{
    C = window.WEEK[n];
    KEYS = Object.keys(C);
    fillSubjects();
    load(); render();
  }).catch(()=>{
    document.getElementById("gBox").innerHTML=
      '<div class="soon"><b>'+n+'주차는 아직 없습니다.</b>다른 주차를 골라 주세요.</div>';
  });
}

/* ══ 탭 ══ */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.t).classList.add("on");
  if(b.dataset.t==="w")drawWrong();
  if(b.dataset.t==="p")drawPage();
});

/* ══ 듣기 ══ */
function drawL(){
  const box=document.getElementById("lBox"), a=C[cur].au;
  if(!a){box.innerHTML='<div class="soon"><b>이 과목은 원어민 음성이 없습니다</b>단어 탭의 🔊 버튼으로 들을 수 있습니다.</div>';return}
  let h='<div class="card"><h3>어휘 전체 듣기 — 원어민 <span style="font-weight:400;color:var(--sub);font-size:13px">'+
        (a.vocLen||"")+'</span></h3>'+
        '<audio controls preload="metadata" style="width:100%" src="'+a.voc+'"></audio>'+
        '<div class="hint">이 주차 어휘를 이어서 읽어줍니다. 단어 탭을 넘기면서 같이 들으세요.</div></div>';
  h+='<div class="card"><h3>대화 '+a.dia.length+'개</h3>'+
     '<button id="playAll" style="width:100%;padding:14px;margin-bottom:10px;border:0;border-radius:11px;'+
     'background:var(--blue2);color:#fff;font-size:16px;font-weight:700;cursor:pointer">▶ '+a.dia.length+'개 이어서 듣기</button>'+
     '<div id="allNow" style="text-align:center;color:var(--sub);font-size:13px;margin-bottom:6px"></div>';
  a.dia.forEach((s,i)=>{
    const src=Array.isArray(s)?s[0]:s, len=Array.isArray(s)?s[1]:"";
    h+='<div style="margin:9px 0"><b>대화 '+(i+1)+'</b> <span style="color:var(--sub);font-size:13px">'+len+'</span>'+
       '<audio class="dia" controls preload="metadata" style="width:100%;margin-top:4px" src="'+src+'"></audio></div>'});
  h+='<div class="hint"><b>대화는 3~9초짜리 짧은 문장입니다.</b> 위의 <b>이어서 듣기</b>로 죽 듣는 게 편합니다.<br>'+
     '먼저 <b>보지 말고 듣고</b>, 무슨 상황인지 생각한 뒤 정리 탭을 펴세요.</div></div>';
  box.innerHTML=h; addSay(box);
  const list=[...box.querySelectorAll("audio.dia")], now=document.getElementById("allNow");
  let idx=-1,on=false;
  function stopAll(){list.forEach(x=>{x.pause();x.currentTime=0})}
  function step(){
    idx++;
    if(idx>=list.length){on=false;idx=-1;now.textContent="";
      document.getElementById("playAll").textContent="▶ "+list.length+"개 이어서 듣기";return}
    now.textContent="대화 "+(idx+1)+" / "+list.length+" 재생 중";
    const el=list[idx]; el.onended=()=>{if(on)step()};
    el.play().catch(()=>{on=false;now.textContent="재생이 막혔습니다. 화면을 한 번 누른 뒤 다시 시도하세요."});
  }
  document.getElementById("playAll").onclick=e=>{
    if(on){on=false;stopAll();now.textContent="";e.target.textContent="▶ "+list.length+"개 이어서 듣기";return}
    stopAll();on=true;idx=-1;e.target.textContent="■ 멈추기";step();
  };
}

/* ══ 단어 ══ */
let vi=0,vBack=false,vList=[];
function drawV(){
  const box=document.getElementById("vBox");
  if(!vList.length){box.innerHTML='<div class="soon"><b>준비 중</b></div>';return}
  const p=vList[vi];
  box.innerHTML='<div class="flip" id="fc"><div>'+
    '<div class="'+(vBack?"zh":"ko")+'">'+(vBack?p[1]:p[0])+'</div>'+
    '<div class="tap">눌러서 뒤집기 点击翻面</div></div></div>'+
    '<button class="wide" id="vSay">🔊 이 단어 읽어주기</button>'+
    '<div class="rowbtn"><button id="vP">← 이전</button><button id="vS">섞기</button><button id="vN">다음 →</button></div>'+
    '<div class="count">'+(vi+1)+' / '+vList.length+'</div>';
  document.getElementById("vSay").onclick=e=>{e.stopPropagation();say(p[0]+". "+p[1],cur+"_v"+String(p[2]).padStart(2,"0"))};
  document.getElementById("fc").onclick=()=>{vBack=!vBack;drawV()};
  document.getElementById("vN").onclick=()=>{vi=(vi+1)%vList.length;vBack=false;drawV()};
  document.getElementById("vP").onclick=()=>{vi=(vi-1+vList.length)%vList.length;vBack=false;drawV()};
  document.getElementById("vS").onclick=()=>{
    for(let i=vList.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vList[i],vList[j]]=[vList[j],vList[i]]}
    vi=0;vBack=false;drawV()};
}

/* ══ 문제 ══ */
function QS(){return C[cur].q||[]}
function foot(){
  document.getElementById("fOk").textContent=S.ok;
  document.getElementById("fNo").textContent=S.no;
  document.getElementById("fLeft").textContent=Math.max(0,QS().length-S.i);
  document.getElementById("pbar").style.width=(QS().length?S.i/QS().length*100:0)+"%";
}
function drawQ(){
  const box=document.getElementById("qBox"),Q=QS();
  if(!Q.length){box.innerHTML='<div class="soon"><b>준비 중</b></div>';foot();return}
  if(S.i>=Q.length){
    const r=Math.round(S.ok/(S.ok+S.no||1)*100);
    box.innerHTML='<div class="done"><div class="big">'+r+'점</div><p>'+Q.length+'문제 중 '+S.ok+'개 정답.</p>'+
      (S.wrong.length?'<p>틀린 '+S.wrong.length+'문제는 <b>오답</b> 탭에서 다시 보세요.</p>':'<p>전부 맞혔습니다.</p>')+'</div>';
    foot();return}
  const n=S.i,it=Q[n];
  let h='<div class="q"><div class="qn">'+(n+1)+' / '+Q.length+'</div>'+
        '<div class="qt">'+it.q+' <button id="qSay" style="border:1px solid var(--line);background:#fff;'+
        'border-radius:8px;padding:3px 9px;font-size:14px;cursor:pointer;vertical-align:middle">🔊</button></div>';
  if(it.s) h+='<div class="qs">'+it.s+'</div>';
  if(it.img){ h+='<div class="imgwrap">';
    it.img.forEach((src,k)=>h+='<button class="optimg" data-k="'+k+'"><div class="n">'+
        it.o[k]+'</div><img src="'+src+'" alt="보기 '+(k+1)+'" loading="lazy"></button>');
    h+='</div>'; }
  else it.o.forEach((t,k)=>h+='<button class="opt" data-k="'+k+'">'+t+'</button>');
  h+='<div class="fb" id="fb"></div><button class="next" id="nx">다음 문제 →</button></div>';
  box.innerHTML=h;
  document.getElementById("qSay").onclick=()=>say(((it.q||'')+' '+(it.s||'')).replace(/<[^>]*>/g,' '));
  let done=false;
  const sel2 = it.img ? ".optimg" : ".opt";
  box.querySelectorAll(sel2).forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const k=+b.dataset.k,fb=document.getElementById("fb");
    box.querySelectorAll(sel2)[it.a].classList.add("ok");
    if(k===it.a){S.ok++;fb.className="fb s";fb.innerHTML="정답입니다. "+it.e}
    else{b.classList.add("no");S.no++;if(!S.wrong.includes(n))S.wrong.push(n);
      fb.className="fb f";fb.innerHTML="아쉽습니다. "+it.e}
    document.getElementById("nx").classList.add("on");save();foot()});
  box.querySelector("#nx").onclick=()=>{S.i++;save();drawQ()};
  foot();
}
function drawWrong(){
  const box=document.getElementById("wBox"),Q=QS();
  if(!S.wrong.length){box.innerHTML='<div class="soon"><b>아직 틀린 문제가 없습니다.</b></div>';return}
  let h="";S.wrong.forEach(n=>{const it=Q[n];
    h+='<div class="q"><div class="qn">'+(n+1)+'번</div><div class="qt">'+it.q+'</div>'+
       (it.s?'<div class="qs">'+it.s+'</div>':'')+
       (it.img?'<img src="'+it.img[it.a]+'" style="width:100%;border-radius:8px;margin:6px 0">':'')+
       '<div class="fb s" style="display:block">정답 — <b>'+it.o[it.a]+'</b><br>'+it.e+'</div></div>'});
  box.innerHTML=h;
}

function drawPage(){
  const box=document.getElementById("pBox"), s=(window.SLIDES&&window.SLIDES[wk]&&window.SLIDES[wk][cur])||[];
  if(!s.length){box.innerHTML='<div class="soon"><b>교안 이미지가 없습니다.</b></div>';return}
  let h='<div class="card"><h3>학교 교안 원본 '+s.length+'장</h3>'+
        '수업에서 쓰는 교안을 그대로 옮긴 것입니다. 위의 <b>정리</b> 탭은 이 교안을 풀어 쓴 것이고, '+
        '여기서는 <b>원본 그대로</b> 볼 수 있습니다. 눌러서 크게 보세요.</div>';
  const dir="img/w"+wk+"/";
  s.forEach((f,i)=>h+='<div class="slide"><a href="'+dir+f+'" target="_blank" rel="noopener">'+
     '<img src="'+dir+f+'" alt="교안 '+(i+1)+'" loading="lazy"></a>'+
     '<div class="cap">'+(i+1)+' / '+s.length+'</div></div>');
  box.innerHTML=h; addSay(box);
}

/* ══ 그리기 ══ */
function render(){
  const c=C[cur];
  document.getElementById("hTitle").textContent=c.name;
  document.getElementById("hSub").textContent=c.week+" · "+c.sub;
  document.title=wk+"주차 · "+c.name;
  vList=(c.voc||[]).map((x,i)=>[x[0],x[1],i+1]);vi=0;vBack=false;
  const g=document.getElementById("gBox");
  g.innerHTML=c.g||'<div class="soon"><b>준비 중</b></div>';
  addSay(g, cur+"_g");
  stopAudio();
  drawV();drawL();drawQ();drawWrong();
  document.getElementById("pBox").innerHTML="";
}
document.getElementById("reset").onclick=()=>{
  if(confirm(C[cur].name+" 기록을 지우고 다시 풀까요?")){
    S={i:0,ok:0,no:0,wrong:[]};save();drawQ();
    document.querySelector('nav button[data-t="q"]').click()}
};
openWeek(wk);
</script>
</body>
